# ==============================================================================
# opsbox 配置文件
#
# 加载顺序（后者覆盖前者，即优先级由低到高）：
#   内置默认值
#   → <安装目录>/conf/opsbox.conf      （本文件，随项目分发的默认值）
#   → /etc/opsbox/opsbox.conf          （系统管理员）
#   → ~/.config/opsbox/opsbox.conf     （当前用户）
#   → 命令行 --conf 指定的文件          （最高）
#
# 语法就是普通的 shell 变量赋值，改完直接生效，不需要重启任何服务。
#
# 建议做法：不要直接改本文件，而是把要覆盖的项写进
#   /etc/opsbox/opsbox.conf
# 本文件优先级比 /etc 低，所以你在 /etc 里的调优不会被它压回去，
# 升级 opsbox 时也不会丢。
# ==============================================================================

# ------------------------------------------------------------------ 通用 ----
# 要运行的模块（顺序固定，与这里写的顺序无关）
OB_CFG_ENABLED_MODULES="system cpu memory disk network service log security"

# 精确静音某些检查项。用 `opsbox list` 可以看到所有检查项的 id。
# 例如：只想关掉 inode 检查和 conntrack 检查
# OB_CFG_DISABLE_CHECKS="disk.inode.root,net.conntrack"
OB_CFG_DISABLE_CHECKS=""

# CPU 采样间隔（秒）。用于计算 CPU 使用率与磁盘 IO 延迟。
# 设为 0 表示不等待，此时 CPU 使用率会以极短窗口计算，仅供参考。
OB_CFG_SAMPLE_INTERVAL="1"

# 报告中 Top N 列表的长度
OB_CFG_TOP_N="5"

# 报告标题
OB_CFG_REPORT_TITLE="Linux 服务器巡检报告"

# ------------------------------------------------------------------ CPU ----
# 负载阈值以「核数的倍数」表示：1.0 表示负载等于核数。
# 这样 4 核和 64 核的机器可以用同一份配置。
OB_CFG_LOAD_WARN_MULT="1.0"
OB_CFG_LOAD_CRIT_MULT="2.0"

# CPU 使用率（%）
OB_CFG_CPU_WARN="85"
OB_CFG_CPU_CRIT="95"

# IO 等待占比（%）。iowait 高说明瓶颈在存储而不是算力。
OB_CFG_IOWAIT_WARN="10"
OB_CFG_IOWAIT_CRIT="25"

# 被宿主机抢占的 CPU 占比（%）。云主机上持续偏高说明超卖严重。
OB_CFG_CPU_STEAL_WARN="5"
OB_CFG_CPU_STEAL_CRIT="15"

# ------------------------------------------------------------------ 内存 ----
# 口径：(MemTotal - MemAvailable) / MemTotal，已排除可回收的 page cache。
# 如果你的机器大量使用 page cache 是正常业务特征，可以适当调高这两个值。
OB_CFG_MEM_WARN="85"
OB_CFG_MEM_CRIT="95"

# Swap 使用率（%）。换页会带来数量级的延迟抖动，所以阈值偏保守。
OB_CFG_SWAP_WARN="50"
OB_CFG_SWAP_CRIT="80"

# 可用内存绝对下限（MB）。这是「越大越糟」的反向指标：
# 低于 warn 告警，低于 crit 严重。
OB_CFG_MEMAVAIL_MIN_MB="256"
OB_CFG_MEMAVAIL_CRIT_MB="64"

# 脏页堆积（MB）。脏页过多意味着后端存储写不过来。
OB_CFG_DIRTY_WARN_MB="512"
OB_CFG_DIRTY_CRIT_MB="2048"

# 内存承诺比（%）。Committed_AS / CommitLimit。
OB_CFG_COMMIT_WARN="90"
OB_CFG_COMMIT_CRIT="100"

# 僵尸进程数
OB_CFG_ZOMBIE_WARN="10"
OB_CFG_ZOMBIE_CRIT="50"

# ------------------------------------------------------------------ 磁盘 ----
OB_CFG_DISK_WARN="80"
OB_CFG_DISK_CRIT="90"

# inode 使用率（%）。小文件多的机器（邮件、缓存、容器镜像层）要重点盯这个。
OB_CFG_INODE_WARN="80"
OB_CFG_INODE_CRIT="90"

# 磁盘平均单次 IO 延迟（ms）。机械盘可以放宽到 50/200，
# 云 SSD 建议保持默认，本地 NVMe 可以收紧到 5/20。
OB_CFG_DISK_LAT_WARN="20"
OB_CFG_DISK_LAT_CRIT="100"

# 小于这个容量（MB）的挂载点不参与告警，避免 /boot/efi 之类的噪音。
OB_CFG_DISK_MIN_SIZE_MB="100"

# 不参与容量检查的文件系统类型（正则，| 分隔）
OB_CFG_DISK_EXCLUDE_FS="tmpfs|devtmpfs|squashfs|overlay|proc|sysfs|cgroup|cgroup2|autofs|debugfs|tracefs|ramfs|fusectl|mqueue|hugetlbfs|securityfs|pstore|configfs|bpf|binfmt_misc|nsfs"

# 不参与容量检查的挂载点（前缀匹配，| 分隔）
OB_CFG_DISK_EXCLUDE_MNT="/run|/dev|/sys|/proc|/snap"

# 只读挂载检查（disk.readonly）专用的排除文件系统类型。
# 只读介质本来就是 ro，不排除它们会产生大量噪音，让人开始忽略这条检查。
# 注意这一项与上面的 OB_CFG_DISK_EXCLUDE_FS 是独立的：后者会影响容量水位统计。
OB_CFG_DISK_READONLY_EXCLUDE_FS="iso9660|udf|squashfs|erofs|romfs|vfat|msdos|exfat|ntfs"

# ------------------------------------------------------------------ 网络 ----
OB_CFG_TCP_WARN="5000"
OB_CFG_TCP_CRIT="10000"

OB_CFG_TIMEWAIT_WARN="3000"
OB_CFG_TIMEWAIT_CRIT="8000"

# CLOSE_WAIT 堆积是应用没关连接的指纹，通常比 TIME_WAIT 更值得告警。
OB_CFG_CLOSEWAIT_WARN="500"
OB_CFG_CLOSEWAIT_CRIT="2000"

# conntrack 连接跟踪表使用率（%）。
# K8s 节点、NAT 网关、跑 Docker 的机器一定要盯这一项。
OB_CFG_CONNTRACK_WARN="80"
OB_CFG_CONNTRACK_CRIT="95"

# 网卡错误率 / 丢包率（%）。用比率而不是累计计数，
# 这样长期运行的机器不会因为历史累计值而误报。
OB_CFG_IFACE_ERR_RATE_WARN="0.01"
OB_CFG_IFACE_ERR_RATE_CRIT="0.1"
OB_CFG_IFACE_DROP_RATE_WARN="0.01"
OB_CFG_IFACE_DROP_RATE_CRIT="0.1"

# ------------------------------------------------------------------ 服务 ----
# 这些服务必须处于 active，否则直接 CRIT。
# 留空表示不做强制检查（新装的机器上还没有业务服务时很有用）。
# OB_CFG_REQUIRED_UNITS="sshd.service,nginx.service,docker.service"
OB_CFG_REQUIRED_UNITS=""

# 这些服务停止只给 WARN。
# OB_CFG_OPTIONAL_UNITS="chronyd.service,crond.service"
OB_CFG_OPTIONAL_UNITS=""

# ------------------------------------------------------------------ 日志 ----
# journalctl --since 的时间窗口
OB_CFG_LOG_SINCE="1 hour ago"

# 窗口内的错误日志条数阈值
OB_CFG_LOG_ERR_WARN="50"
OB_CFG_LOG_ERR_CRIT="500"

# 没有 journald 时，扫描这些文件（空格分隔）
OB_CFG_LOG_FILES="/var/log/syslog /var/log/messages /var/log/kern.log"

# 每个日志文件扫描的尾部字节数
OB_CFG_LOG_SCAN_BYTES="2097152"

# 单个日志文件体积阈值（MB）
OB_CFG_LOG_BIG_MB_WARN="512"
OB_CFG_LOG_BIG_MB_CRIT="2048"

# 崩溃转储目录
OB_CFG_CRASH_DUMP_DIRS="/var/crash /var/spool/abrt"
OB_CFG_CRASH_WARN="1"
OB_CFG_CRASH_CRIT="5"

# ------------------------------------------------------------------ 安全 ----
# SUID 文件扫描（默认关闭：全盘扫描较慢，且基线需要人工维护）
OB_CFG_SEC_SUID_ENABLE="0"
OB_CFG_SEC_SUID_ROOT="/usr/bin"
OB_CFG_SEC_SUID_MAX="500"

# PermitRootLogin yes 是否判为 CRIT。
# 设为 0 则降级为 WARN（适用于已用密钥+来源白名单做补偿控制的场景）。
OB_CFG_SSHD_WEAK_PERMITROOT="1"

# ------------------------------------------------------------------ 系统 ----
# 运行时长低于此值（秒）时提示「疑似刚重启」，有助于发现崩溃循环。
OB_CFG_UPTIME_MIN_WARN="600"

# 文件句柄使用率（%）
OB_CFG_FD_WARN="80"
OB_CFG_FD_CRIT="90"

# PID 用量（%）
OB_CFG_PID_WARN="80"
OB_CFG_PID_CRIT="95"

# 时间窗口内的 OOM 事件次数
OB_CFG_OOM_WARN="1"
OB_CFG_OOM_CRIT="5"
